name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/research.txt
      - name: Install CPU runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install current compatible dependencies and check the text extra
        if: matrix.python == '3.11'
        run: |
          python -m pip install '.[research,text]' build twine
          python -m pip check
          python -c "from sentence_transformers import SentenceTransformer; print(SentenceTransformer.__name__)"
      - name: Install the paper's reference dependencies
        if: matrix.python == '3.13'
        run: |
          python -m pip install -c constraints/research.txt '.[research]'
          python -m pip check
      - run: make test
      - if: matrix.python == '3.13'
        run: make reproduce
      - if: matrix.python == '3.11'
        run: make package

  manuscript:
    name: Manuscript and appendices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild with the pinned TeX toolchain and compare the archived PDF
        run: |
          mkdir -p build
          cp paper/alfm-bem.pdf build/distributed.pdf
          make paper-container REFERENCE=build/distributed.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuscript-and-appendices
          path: paper/alfm-bem.pdf
          if-no-files-found: error

  required:
    name: Release checks
    if: always()
    needs: [tests, manuscript]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test and manuscript job to pass
        env:
          TESTS: ${{ needs.tests.result }}
          MANUSCRIPT: ${{ needs.manuscript.result }}
        run: test "$TESTS" = success && test "$MANUSCRIPT" = success
