version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    exclude-paths:
      - "constraints/research.txt" # Versions used to reproduce the published results.
    groups:
      text-encoders:
        patterns:
          - "sentence-transformers"
          - "transformers"
